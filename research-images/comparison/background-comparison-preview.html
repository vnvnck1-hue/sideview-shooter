  gap: 6px;
}

  height: 14px;

  transition:

    border-color 150ms,
    box-shadow 150ms;

  border-color: var(--input);

}

  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;

  height: 14px;

  outline-offset: 2px;
}

  cursor: not-allowed;
  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

.form-check-label {

    (() =&gt; {
      const root=document.getElementById(&#x27;bg-compare-0922&#x27;);
      const q=id=&gt;root.querySelector(&#x27;#&#x27;+id);
      const data=JSON.parse(q(&#x27;bg-data&#x27;).textContent);
      const names={workshop:&#x27;작업실&#x27;,hall:&#x27;대형 정비 홀&#x27;,tank_room:&#x27;저수조실&#x27;,analysis_lab:&#x27;검체 분석실&#x27;,airlock:&#x27;에어록&#x27;};
      const state={view:&#x27;composition&#x27;,room:&#x27;workshop&#x27;,gray:false,outline:false};
      const node=(name,attrs={},text=&#x27;&#x27;)=&gt;{const n=document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,name);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n;};
      function line(svg,x1,y1,x2,y2,color=&#x27;var(--border)&#x27;,dash=&#x27;&#x27;){svg.append(node(&#x27;line&#x27;,{x1,y1,x2,y2,stroke:color,&#x27;stroke-width&#x27;:1.5,&#x27;stroke-dasharray&#x27;:dash}));}
      function outline(){
        const svg=q(&#x27;bg-outline-svg&#x27;),p=q(&#x27;bg-ours-photo&#x27;),w=p.clientWidth,h=p.clientHeight;
        if(!w||!h)return;svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${w} ${h}`);svg.replaceChildren();
        if(!state.outline)return;
        const r=data.rooms[state.room],cols=r.columns,xs=w/2240,ys=h/900;
        const top=cols.flatMap(c=&gt;[[c[0],c[1]],[c[0]+c[2],c[1]]]);
        const last=cols[cols.length-1],first=cols[0];
        const points=[...top,[last[0]+last[2],last[1]+last[3]],[first[0],first[1]+first[3]]].map(v=&gt;`${v[0]*xs},${v[1]*ys}`).join(&#x27; &#x27;);
        svg.append(node(&#x27;polygon&#x27;,{points,fill:&#x27;none&#x27;,stroke:&#x27;var(--viz-series-1)&#x27;,&#x27;stroke-width&#x27;:2}));
        line(svg,Math.max(0,first[0]*xs),r.feet[1]*ys,Math.min(w,(last[0]+last[2])*xs),r.feet[1]*ys,&#x27;var(--viz-series-2)&#x27;,&#x27;5 4&#x27;);
      }
      function geometry(){
        if(state.view!==&#x27;perspective&#x27;)return;
        for(const id of [&#x27;bg-flat-svg&#x27;,&#x27;bg-vp-svg&#x27;]){
          const svg=q(id),w=svg.clientWidth,h=240;svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${w} ${h}`);svg.setAttribute(&#x27;height&#x27;,h);svg.replaceChildren();
          if(id===&#x27;bg-flat-svg&#x27;){
            const x=20,y=34,rw=w-40,rh=160;
            svg.append(node(&#x27;rect&#x27;,{x,y,width:rw,height:rh,fill:&#x27;var(--muted)&#x27;,stroke:&#x27;var(--border)&#x27;}));
            for(let n=1;n&lt;4;n++)line(svg,x,y+n*rh/4,x+rw,y+n*rh/4);
            for(let n=1;n&lt;5;n++)line(svg,x+n*rw/5,y,x+n*rw/5,y+rh);
            const bx=w*.22,by=146,bw=w*.3,bh=56,dx=22,dy=-16;
            svg.append(node(&#x27;polygon&#x27;,{points:`${bx},${by} ${bx+bw},${by} ${bx+bw+dx},${by+dy} ${bx+dx},${by+dy}`,fill:&#x27;var(--secondary)&#x27;,stroke:&#x27;var(--foreground)&#x27;}));
            svg.append(node(&#x27;rect&#x27;,{x:bx,y:by,width:bw,height:bh,fill:&#x27;var(--muted)&#x27;,stroke:&#x27;var(--foreground)&#x27;}));
            svg.append(node(&#x27;polygon&#x27;,{points:`${bx+bw},${by} ${bx+bw+dx},${by+dy} ${bx+bw+dx},${by+bh+dy} ${bx+bw},${by+bh}`,fill:&#x27;var(--secondary)&#x27;,stroke:&#x27;var(--foreground)&#x27;}));
            line(svg,10,204,w-10,204,&#x27;var(--viz-series-2)&#x27;,&#x27;5 4&#x27;);
            svg.append(node(&#x27;text&#x27;,{x:12,y:226},&#x27;발 접지선&#x27;));svg.append(node(&#x27;text&#x27;,{x:20,y:22},&#x27;정면 벽: 깊이 방향 모서리 부족&#x27;));
          }else{
            const vp=[w*.83,51],a=[w*.13,130],b=[w*.43,130],c=[w*.43,204],d=[w*.13,204];
            const lerp=p=&gt;[p[0]+(vp[0]-p[0])*.4,p[1]+(vp[1]-p[1])*.4];const aa=lerp(a),bb=lerp(b),cc=lerp(c);
            line(svg,10,vp[1],w-10,vp[1],&#x27;var(--viz-series-1)&#x27;,&#x27;5 4&#x27;);
            for(const p of [a,b,c])line(svg,p[0],p[1],vp[0],vp[1],&#x27;var(--viz-series-1)&#x27;,&#x27;4 4&#x27;);
            const poly=(points,fill)=&gt;svg.append(node(&#x27;polygon&#x27;,{points:points.map(p=&gt;p.join(&#x27;,&#x27;)).join(&#x27; &#x27;),fill,stroke:&#x27;var(--foreground)&#x27;,&#x27;stroke-width&#x27;:1.5}));
            poly([a,b,bb,aa],&#x27;var(--secondary)&#x27;);poly([b,c,cc,bb],&#x27;var(--muted)&#x27;);poly([a,b,c,d],&#x27;var(--background)&#x27;);
            svg.append(node(&#x27;circle&#x27;,{cx:vp[0],cy:vp[1],r:4,fill:&#x27;var(--viz-series-1)&#x27;}));
            svg.append(node(&#x27;text&#x27;,{x:12,y:39},&#x27;H · 눈높이&#x27;));svg.append(node(&#x27;text&#x27;,{x:vp[0],y:23,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},&#x27;소실점 V&#x27;));
            line(svg,10,204,w-10,204,&#x27;var(--viz-series-2)&#x27;,&#x27;5 4&#x27;);svg.append(node(&#x27;text&#x27;,{x:12,y:226},&#x27;발 접지선&#x27;));
          }
        }
      }
      function render(){
        q(&#x27;bg-view&#x27;).value=state.view;q(&#x27;bg-room&#x27;).value=state.room;q(&#x27;bg-gray&#x27;).checked=state.gray;q(&#x27;bg-outline&#x27;).checked=state.outline;
        q(&#x27;bg-room-label&#x27;).hidden=state.view!==&#x27;composition&#x27;;
        for(const [id,value] of [[&#x27;bg-composition&#x27;,&#x27;composition&#x27;],[&#x27;bg-pixels&#x27;,&#x27;pixels&#x27;],[&#x27;bg-perspective&#x27;,&#x27;perspective&#x27;]])q(id).hidden=state.view!==value;
        q(&#x27;bg-composition&#x27;).classList.toggle(&#x27;gray&#x27;,state.gray);
        const r=data.rooms[state.room];q(&#x27;bg-ours-image&#x27;).src=r.image;q(&#x27;bg-ours-image&#x27;).alt=`우리 게임 ${names[state.room]}의 실제 렌더. CRT와 HUD 제외.`;
        q(&#x27;bg-ours-title&#x27;).textContent=&#x27;우리 게임 · &#x27;+names[state.room];
        q(&#x27;bg-metrics&#x27;).replaceChildren();
        for(const value of [`방 실루엣 ${r.area.toFixed(1)}%`,`방 바깥 ${(100-r.area).toFixed(1)}%`]){const el=document.createElement(&#x27;span&#x27;);el.textContent=value;q(&#x27;bg-metrics&#x27;).append(el);}
        requestAnimationFrame(()=&gt;{outline();geometry();});
      }
      function restore(saved){const s=saved?.modelContent||saved?.privateContent||{};if([&#x27;composition&#x27;,&#x27;pixels&#x27;,&#x27;perspective&#x27;].includes(s.view))state.view=s.view;if(data.rooms[s.room])state.room=s.room;state.gray=!!s.gray;state.outline=!!s.outline;}
      function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{...state},privateContent:null}).catch(()=&gt;{});}
      restore(window.openai?.widgetState);
      for(const [id,key] of [[&#x27;bg-view&#x27;,&#x27;view&#x27;],[&#x27;bg-room&#x27;,&#x27;room&#x27;],[&#x27;bg-gray&#x27;,&#x27;gray&#x27;],[&#x27;bg-outline&#x27;,&#x27;outline&#x27;]])q(id).addEventListener(&#x27;change&#x27;,e=&gt;{state[key]=e.target.type===&#x27;checkbox&#x27;?e.target.checked:e.target.value;render();save();});
      window.addEventListener(&#x27;openai:set_globals&#x27;,e=&gt;{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
      q(&#x27;bg-ms-image&#x27;).src=data.ms;
      q(&#x27;bg-pixel-wall&#x27;).src=data.pixels.wall;q(&#x27;bg-pixel-locker&#x27;).src=data.pixels.locker;q(&#x27;bg-pixel-bench&#x27;).src=data.pixels.bench;
      q(&#x27;bg-ours-image&#x27;).addEventListener(&#x27;load&#x27;,outline);
      new ResizeObserver(()=&gt;{outline();geometry();}).observe(root);
      render();
    })();
